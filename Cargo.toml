[workspace]
resolver = "2"
members = [ 
    "crates/client", 
    "crates/logic", 
    "crates/protocol",
    "crates/server", 
    "crates/tools"
    ]

[workspace.package]
name = "mud"
description = "A mud written in rust"
authors = ["ssargent"]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
uuid = { version = "1.11.0", features = ["serde", "v4"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_derive = "1.0"
protocol = { path = "crates/protocol" }